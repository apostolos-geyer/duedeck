services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: duedeck
      POSTGRES_PASSWORD: duedeck
      POSTGRES_DB: duedeck
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: duedeck
      MINIO_ROOT_PASSWORD: duedeck123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 duedeck duedeck123 &&
      mc mb --ignore-existing local/uploads &&
      echo 'Bucket uploads created'
      "

volumes:
  pgdata:
  minio_data:
